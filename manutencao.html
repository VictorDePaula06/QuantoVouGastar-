<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção do Veículo - Quanto Vou Gastar</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121214">
    <link rel="icon" href="/Imgs/logo7.png">
    <link rel="apple-touch-icon" href="/Imgs/logo7.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quanto Vou Gastar">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'quicksand': ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        // Identidade Alívia
                        'azul-ceu': '#10b981',
                        'verde-respira': '#10b981',
                        'crema-paz': '#FFF08C',
                        'dark-bg': '#121214',
                        'dark-card': '#1c1c20',
                        'dark-border': '#3f3f46',
                        'input-bg-darker': '#0a0a0b',
                        'light-gray-text': '#a1a1aa',
                    }
                }
            }
        }
    </script>
</head>

<body class="font-quicksand bg-dark-bg min-h-screen text-[#fafafa] relative overflow-x-hidden selection:bg-azul-ceu/30">
    <header class="bg-dark-card shadow-lg border-b border-dark-border fixed w-full top-0 z-40">
        <div class="max-w-10xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <img src="Imgs/logo7.png" alt="Logo QuantovouGastar" class="h-14 w-auto">
                    <div>
                        <h1 class="text-xl font-bold text-gray-50 hidden sm:block">Manutenção do Veículo</h1>
                        <h1 class="text-lg font-bold text-gray-50 sm:hidden">Manutenção</h1>
                        <p class="text-xs text-light-gray-text hidden sm:block">Fique de olho nas trocas do seu carro</p>
                    </div>
                </div>

                <div id="authStatus" class="flex items-center space-x-2">
                    <a href="/"
                        class="bg-input-bg-darker p-2.5 rounded-full hover:bg-dark-border transition-colors text-white"
                        title="Voltar ao menu">
                        <i class="fas fa-th-large text-lg"></i>
                    </a>
                    <button id="authBtn"
                        class="bg-input-bg-darker p-2.5 rounded-full hover:bg-dark-border transition-colors text-white"
                        title="Entrar/Sair">
                        <i class="fab fa-google text-xl" id="authIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 max-w-2xl mx-auto px-4 pt-24 pb-16 space-y-3">

        <div class="card-section border border-azul-ceu/50 glass-card">
            <h2 class="section-title text-gray-200">
                <i class="fas fa-car mr-2"></i> Selecione o Veículo
            </h2>
            <div class="space-y-3">
                <select id="maintVeiculo" class="input-field">
                    <option value="">Escolha um veículo</option>
                </select>
                <div>
                    <label for="maintKmAtual" class="input-label">Km atual do veículo</label>
                    <input type="number" id="maintKmAtual" placeholder="Ex: 45000" class="input-field">
                </div>
            </div>
        </div>

        <!-- Barra discreta: só expande quando o usuário quer ler o guia -->
        <button id="toggleGuiaBtn"
            class="w-full flex items-center justify-between px-4 py-2.5 rounded-full bg-white/5 border border-gray-700 text-sm text-gray-300 hover:bg-white/10 transition-colors"
            title="Mostrar/Esconder guia">
            <span><i class="fas fa-circle-info mr-2 text-azul-ceu"></i>Por que esses intervalos?</span>
            <i class="fas fa-chevron-down text-xs"></i>
        </button>
        <div id="guiaManutencao" class="card-section border border-gray-600 glass-card space-y-3 hidden"></div>

        <div class="card-section border border-gray-600 glass-card">
            <div class="flex justify-between items-center mb-2">
                <h2 class="section-title text-gray-200 mb-0 pb-0 border-0">
                    <i class="fas fa-tools mr-2"></i> Manutenções
                </h2>
                <button id="toggleAddManutencaoBtn" class="btn-primary py-2 px-3 text-sm" title="Registrar Manutenção">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div id="manutencoesList" class="space-y-2 w-full">
                <div class="p-3 text-center text-sm text-gray-500">Faça login e selecione um veículo para ver as manutenções.</div>
            </div>
        </div>

        <div id="addManutencaoForm" class="card-section border border-azul-ceu/50 glass-card hidden">
            <h2 class="section-title text-azul-ceu">
                <i class="fas fa-plus-circle mr-2"></i> Registrar Manutenção
            </h2>
            <div class="space-y-3">
                <div>
                    <label for="maintTipo" class="input-label">Tipo de Manutenção</label>
                    <select id="maintTipo" class="input-field"></select>
                    <p id="maintTipoMotivo" class="text-xs text-gray-400 mt-1.5"></p>
                </div>
                <div>
                    <label for="maintData" class="input-label">Data da Última Troca</label>
                    <input type="date" id="maintData" class="input-field">
                </div>
                <div>
                    <label for="maintKm" class="input-label">Km da Última Troca</label>
                    <input type="number" id="maintKm" placeholder="Ex: 40000" class="input-field">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="maintIntervaloKm" class="input-label">Intervalo (km)</label>
                        <input type="number" id="maintIntervaloKm" class="input-field">
                    </div>
                    <div>
                        <label for="maintIntervaloMeses" class="input-label">Intervalo (meses)</label>
                        <input type="number" id="maintIntervaloMeses" class="input-field">
                    </div>
                </div>
                <button id="salvarManutencaoBtn" class="w-full btn-primary">
                    <i class="fas fa-save mr-2"></i> Salvar
                </button>
            </div>
        </div>

    </main>

    <div id="loginPromptModal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center p-4 z-50">
        <div class="bg-dark-card p-6 rounded-xl shadow-2xl w-full max-w-sm border border-gray-700 glass-card relative">
            <button id="closeLoginModalBtn" class="absolute top-3 right-3 text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-center text-azul-ceu">
                <i class="fas fa-lock mr-2"></i> Login Necessário
            </h3>
            <p class="text-center text-gray-300 mb-6">Por favor, faça login com o Google para acessar esta funcionalidade.</p>
            <button id="googleLoginPromptBtn"
                class="w-full bg-white text-gray-800 font-medium py-3 px-4 rounded-lg flex items-center justify-center shadow-lg hover:bg-gray-200 transition-colors">
                <i class="fab fa-google text-xl mr-3"></i> Entrar com Google
            </button>
        </div>
    </div>

    <script type="module" src="/src/manutencao-main.js"></script>
</body>

</html>
