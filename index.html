<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quanto Vou Gastar</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121214">
    <link rel="icon" href="/Imgs/logo7.png">
    <link rel="apple-touch-icon" href="/Imgs/logo7.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Quanto Vou Gastar">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'quicksand': ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        // Identidade Alívia
                        'azul-ceu': '#10b981',
                        'verde-respira': '#10b981',
                        'crema-paz': '#FFF08C',
                        'dark-bg': '#121214',
                        'dark-card': '#1c1c20',
                        'dark-border': '#3f3f46',
                        'light-gray-text': '#a1a1aa',
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body class="font-quicksand bg-dark-bg min-h-screen text-[#fafafa] relative overflow-x-hidden selection:bg-azul-ceu/30 flex items-center justify-center p-6">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[10%] w-[60%] h-[60%] bg-verde-respira/8 rounded-full blur-[120px] animate-blob"></div>
    </div>

    <main class="relative z-10 w-full max-w-2xl">
        <div class="text-center mb-10">
            <img src="Imgs/logo7.png" alt="Logo QuantovouGastar" class="h-20 w-auto mx-auto mb-4">
            <h1 class="text-2xl font-bold text-gray-50">Quanto Vou Gastar</h1>
            <p class="text-sm text-light-gray-text mt-1">Escolha o que você quer usar hoje</p>
        </div>

        <div class="grid sm:grid-cols-2 gap-5">
            <a href="/combustivel.html"
                class="glass-card border border-azul-ceu/30 p-8 flex flex-col items-center text-center hover:border-azul-ceu hover:-translate-y-1 transition-all shadow-lg group">
                <div class="bg-azul-ceu/15 border border-azul-ceu/30 rounded-full w-16 h-16 flex items-center justify-center mb-4 group-hover:shadow-[0_0_20px_rgba(16,185,129,0.35)] transition-all">
                    <i class="fas fa-gas-pump text-2xl text-azul-ceu"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-50">Calculadora de Combustível</h2>
                <p class="text-sm text-light-gray-text mt-1">Planeje viagens, calcule custo e pedágio</p>
            </a>

            <a href="/manutencao.html"
                class="glass-card border border-verde-respira/30 p-8 flex flex-col items-center text-center hover:border-verde-respira hover:-translate-y-1 transition-all shadow-lg group">
                <div class="bg-verde-respira/15 border border-verde-respira/30 rounded-full w-16 h-16 flex items-center justify-center mb-4 group-hover:shadow-[0_0_20px_rgba(105,200,185,0.35)] transition-all">
                    <i class="fas fa-wrench text-2xl text-verde-respira"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-50">Manutenção do Veículo</h2>
                <p class="text-sm text-light-gray-text mt-1">Fique de olho na troca de óleo e outras revisões</p>
            </a>
        </div>
    </main>

</body>

</html>
